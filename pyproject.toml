[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agroflight-rl"
version = "0.1.0"
description = "RL for crop-row quadrotor flight control (MuJoCo Skydio X2)"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "mujoco",
    "gymnasium",
    "numpy",
    "tensorboard",
]

[project.optional-dependencies]
# Notebooks and training. The pip `cleanrl` package (0.4.8) is an old gym-era
# release that fails on import; PPO uses CleanRL's single-file script copied
# into the repo instead.
train = ["torch", "matplotlib", "pandas"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
